<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARP Guard - Network Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14; --panel: #11161f; --panel-2: #0d1219; --border: #1e2530;
    --text: #e8eaed; --muted: #6b7685;
    --safe: #3ddc84; --danger: #ff4757; --warn: #ffa502; --data: #4fc3f7;
    --font-ui: "Space Grotesk", sans-serif; --font-data: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui);
    padding: 20px 28px 50px; max-width: 1180px; margin: 0 auto;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    padding-bottom: 16px; margin-bottom: 24px; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
  .brand-mark { color: var(--safe); font-size: 20px; }
  .os-badge {
    font-size: 11px; font-family: var(--font-data); color: var(--muted);
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; margin-left: 6px;
  }
  .nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .navlink { padding: 7px 13px; border-radius: 7px; text-decoration: none; font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .navlink:hover { background: var(--panel); color: var(--text); }
  .navlink.active { background: rgba(61,220,132,0.12); color: var(--safe); }

  .layout { display: grid; grid-template-columns: 1fr 280px; gap: 18px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  .map-panel {
    background:
      radial-gradient(circle at 50% 0%, rgba(79,195,247,0.05), transparent 60%),
      var(--panel);
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 32px 32px;
    border: 1px solid var(--border); border-radius: 16px; padding: 24px;
    min-height: 520px; display: flex; flex-direction: column;
  }

  .legend { display: flex; gap: 20px; margin-bottom: 8px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; font-family: var(--font-data); }
  .legend-item { display: flex; align-items: center; gap: 7px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; }

  .map-body { flex: 1; display: flex; align-items: center; justify-content: center; }
  .empty-state { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 20px; }
  .empty-state .big { font-size: 15px; color: var(--text); margin-bottom: 6px; }

  .side-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; height: fit-content;
  }
  .side-panel h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 0; font-weight: 500; }

  .mini-stat { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .mini-stat:last-of-type { border-bottom: none; }
  .mini-stat .label { font-size: 12px; color: var(--muted); }
  .mini-stat .value { font-family: var(--font-data); font-size: 15px; font-weight: 700; }
  .mini-stat .value.danger { color: var(--danger); }
  .mini-stat .value.safe { color: var(--safe); }

  .node-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
  .node-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    background: var(--panel-2); border-radius: 8px; font-size: 12px;
  }
  .node-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .node-ip { font-family: var(--font-data); color: var(--data); font-weight: 700; }
  .node-sub { color: var(--muted); font-size: 10.5px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="brand-mark">&#9670;</span>ARP GUARD<span class="os-badge" id="osBadge">-</span></div>
  <nav class="nav">
    <a href="/" class="navlink">Dashboard</a>
    <a href="/blocklist" class="navlink">Manage Blocks</a>
    <a href="/network" class="navlink active">Network Map</a>
    <a href="/whitelist" class="navlink">Whitelist</a>
    <a href="/logs" class="navlink">Full Logs</a>
    <a href="/overview" class="navlink">Project Overview</a>
  </nav>
</div>

<div class="layout">
  <div class="map-panel">
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:#4fc3f7"></span>Gateway</div>
      <div class="legend-item"><span class="legend-dot" style="background:#3ddc84"></span>This endpoint (victim)</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ff4757"></span>Active attacker</div>
      <div class="legend-item"><span class="legend-dot" style="background:#6b7685"></span>Blocked attacker</div>
    </div>
    <div class="map-body" id="mapContainer">
      <div class="empty-state">Connecting to agent...</div>
    </div>
  </div>

  <div class="side-panel">
    <h3>Session summary</h3>
    <div class="mini-stat"><span class="label">Gateway IP</span><span class="value" id="statGwIp">-</span></div>
    <div class="mini-stat"><span class="label">This endpoint</span><span class="value" id="statLocalIp">-</span></div>
    <div class="mini-stat"><span class="label">Active attackers</span><span class="value danger" id="statActive">0</span></div>
    <div class="mini-stat"><span class="label">Blocked attackers</span><span class="value safe" id="statBlocked">0</span></div>

    <h3 style="margin-top:6px;">Nodes</h3>
    <div class="node-list" id="nodeList">
      <div style="color:var(--muted); font-size:12px;">No attackers yet.</div>
    </div>
  </div>
</div>

<script>
  var svgNS = "http://www.w3.org/2000/svg";

  function el(tag, attrs) {
    var e = document.createElementNS(svgNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function drawMap(status, attackers) {
    var container = document.getElementById("mapContainer");
    var width = 820, height = 460;
    var cx = width / 2, cy = height / 2;

    if (!status.gateway_ip) {
      container.innerHTML = '<div class="empty-state"><div class="big">Waiting for agent</div>Establishing trusted baseline...</div>';
      return;
    }

    var svg = el("svg", { width: "100%", viewBox: "0 0 " + width + " " + height });
    var gwX = cx, gwY = 60;
    var vX = cx, vY = cy - 20;

    svg.appendChild(el("line", { x1: gwX, y1: gwY + 26, x2: vX, y2: vY - 30, stroke: "#4fc3f7", "stroke-width": 1.5, opacity: 0.6 }));

    function drawNode(x, y, r, color, label, sublabel) {
      var g = el("g", {});
      g.appendChild(el("circle", { cx: x, cy: y, r: r, fill: color, opacity: 0.15 }));
      g.appendChild(el("circle", { cx: x, cy: y, r: r * 0.55, fill: color }));
      var t1 = el("text", { x: x, y: y + r + 18, "text-anchor": "middle", fill: "#e8eaed", "font-size": 12, "font-weight": 700, "font-family": "Space Grotesk, sans-serif" });
      t1.textContent = label;
      g.appendChild(t1);
      if (sublabel) {
        var t2 = el("text", { x: x, y: y + r + 34, "text-anchor": "middle", fill: "#6b7685", "font-size": 11, "font-family": "JetBrains Mono, monospace" });
        t2.textContent = sublabel;
        g.appendChild(t2);
      }
      return g;
    }

    svg.appendChild(drawNode(gwX, gwY, 22, "#4fc3f7", "Gateway", status.gateway_ip));
    svg.appendChild(drawNode(vX, vY, 26, "#3ddc84", "This endpoint", status.local_ip || ""));

    var n = attackers.length;
    if (n > 0) {
      var radius = 170;
      var startAngle = Math.PI * 0.12;
      var endAngle = Math.PI * 0.88;
      attackers.forEach(function(a, i) {
        var angle = n === 1 ? Math.PI / 2 : startAngle + (endAngle - startAngle) * (i / (n - 1));
        var ax = vX + radius * Math.cos(angle);
        var ay = vY + 70 + radius * Math.sin(angle) * 0.85;
        var color = a.blocked ? "#6b7685" : "#ff4757";

        svg.appendChild(el("line", { x1: vX, y1: vY + 30, x2: ax, y2: ay - 20, stroke: color, "stroke-width": a.blocked ? 1 : 1.5, "stroke-dasharray": a.blocked ? "4 4" : "none", opacity: 0.7 }));
        svg.appendChild(drawNode(ax, ay, 17, color, a.ip, a.hostname !== "Unknown" ? a.hostname : a.mac.slice(-8)));
      });
    }

    container.innerHTML = "";
    container.appendChild(svg);
  }

  function renderNodeList(attackers) {
    var list = document.getElementById("nodeList");
    if (attackers.length === 0) {
      list.innerHTML = '<div style="color:var(--muted); font-size:12px;">No attackers yet - map will populate automatically.</div>';
      return;
    }
    list.innerHTML = attackers.map(function(a) {
      var color = a.blocked ? "#6b7685" : "#ff4757";
      var sub = (a.hostname !== "Unknown" ? a.hostname : a.mac) + " &middot; " + (a.blocked ? "blocked" : "active");
      return (
        '<div class="node-item">' +
          '<span class="node-dot" style="background:' + color + '"></span>' +
          '<span><div class="node-ip">' + a.ip + '</div><div class="node-sub">' + sub + '</div></span>' +
        '</div>'
      );
    }).join("");
  }

  function refresh() {
    Promise.all([
      fetch("/api/status").then(function(r) { return r.json(); }),
      fetch("/api/attackers").then(function(r) { return r.json(); }),
    ]).then(function(results) {
      var status = results[0], attackers = results[1];
      drawMap(status, attackers);
      renderNodeList(attackers);

      document.getElementById("osBadge").textContent = (status.os_name || "-") + (status.os_release ? " " + status.os_release : "");
      document.getElementById("statGwIp").textContent = status.gateway_ip || "-";
      document.getElementById("statLocalIp").textContent = status.local_ip || "-";

      var active = attackers.filter(function(a) { return !a.blocked; }).length;
      var blocked = attackers.filter(function(a) { return a.blocked; }).length;
      document.getElementById("statActive").textContent = active;
      document.getElementById("statBlocked").textContent = blocked;
    }).catch(function() {});
  }

  refresh();
  setInterval(refresh, 2000);
</script>

</body>
</html>
